# ReconIQ full stack: PostgreSQL + FastAPI backend + nginx-served dashboard.
# Usage: cp backend/.env.example backend/.env  (add provider keys), then `docker compose up --build`
# Dashboard: http://localhost:8080   API docs: http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reconiq
      POSTGRES_PASSWORD: reconiq
      POSTGRES_DB: reconiq
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconiq"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://reconiq:reconiq@db:5432/reconiq
      ENVIRONMENT: production
      DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
