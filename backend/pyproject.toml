[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reconiq-backend"
version = "1.0.0"
description = "ReconIQ - Enterprise Threat Analysis Platform Backend Architecture. Evidence. Intelligence. Trust."
requires-python = ">=3.10"
authors = [
    { name = "ReconIQ Security Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "phonenumbers>=8.13.0",
    "httpx>=0.26.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.0.0",
    "opencv-python-headless>=4.9.0",
    "pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "anthropic>=1.13.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.0",
    "fpdf2>=2.7.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
postgres = [
    "psycopg[binary]>=3.1.18",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
